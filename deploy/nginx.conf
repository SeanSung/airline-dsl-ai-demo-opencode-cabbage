# 同源：静态 SPA + /api 反代到 Bun 后端
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # gzip：Cesium/JS/CSS 体积大，开启压缩
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm;
    gzip_min_length 1024;

    # 反向代理到后端容器（compose 服务名 server）
    location /api/ {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE（/api/conversations/:id/messages 流式输出）必须关缓冲
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # Cesium 静态资源（Workers/Assets/Widgets/ThirdParty）：长缓存，不做 SPA 回退
    location /cesium/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 带 hash 的构建产物长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA 路由回退：任何未匹配路径返回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
